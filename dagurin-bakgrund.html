<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="1800">
  <title>Dagsins rættur á Glasi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #111816;
      background: #eef4f1;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background-image: url("dagurin-bakgrund.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(248, 252, 250, 0.76);
    }

    main {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100%;

      padding: 54px 66px 48px;

      display: flex;
      flex-direction: column;
    }

    header {
      height: 180px;
      flex: 0 0 180px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    h1 {
      margin: 0;

      color: #005a46;

      font-size: 74px;
      line-height: 0.95;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 18px;

      color: #0b8a64;

      font-size: 29px;
    }

    .clock {
      padding: 16px 18px;

      color: #005a46;
      background: rgba(255, 255, 255, 0.78);

      border-radius: 14px;

      font-size: 24px;
      white-space: nowrap;
    }

    .card {
      position: relative;

      flex: 1 1 auto;
      min-height: 0;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.95);

      border: 4px solid #005a46;
      border-radius: 28px;

      box-shadow: 0 16px 38px rgba(0, 70, 52, 0.16);
    }

    .stripe {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;

      width: 24px;

      background: #0b8a64;
    }

    .content {
      width: 100%;
      height: 100%;

      padding: 60px 70px 60px 94px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .icon-disc {
      width: 340px;
      height: 340px;

      margin-bottom: 34px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-disc img {
      display: block;

      width: 340px;
      height: 340px;

      object-fit: contain;
    }

    .day-row {
      margin-bottom: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 24px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 16px 28px;

      border-radius: 32px;

      background: #0b8a64;
      color: #ffffff;

      font-size: 32px;
      font-weight: bold;
      line-height: 1;

      letter-spacing: 1px;
      white-space: nowrap;
    }

    .day {
      margin: 0;

      color: #005a46;

      font-size: 64px;
      line-height: 1;

      white-space: nowrap;
    }

    .dish {
      width: 100%;
      max-width: 860px;

      margin: 0 auto;

      color: #111816;

      font-size: 82px;
      font-weight: bold;

      line-height: 1.08;
      letter-spacing: -1px;

      text-align: center;
      word-break: normal;
    }

    .error {
      color: #005a46;

      font-size: 42px;
      font-weight: bold;

      line-height: 1.3;
      text-align: center;
    }

    .suberror {
      margin-top: 18px;

      color: #5f756e;

      font-size: 24px;
      font-weight: normal;
    }

    footer {
      height: 34px;
      flex: 0 0 34px;

      padding-top: 10px;

      display: flex;
      justify-content: space-between;

      color: #0b8a64;
      font-size: 17px;
    }

    #status {
      color: #6a7d77;
    }
  </style>
</head>

<body>

  <div class="stage">

    <div class="overlay"></div>

    <main>

      <header>
        <div>
          <h1>Dagsins rættur</h1>

          <div class="subtitle">
            Døgurði frá kl. 11:15 til 12:30
          </div>
        </div>

        <div class="clock">
          <span id="dateText"></span>
          <span> | </span>
          <strong id="timeText"></strong>
        </div>
      </header>

      <section
        class="card"
        id="content"
      >
        <div class="stripe"></div>

        <div class="content">
          <div class="error">
            Lesur matskránna…
          </div>
        </div>
      </section>

      <footer>
        <span id="status"></span>
        <span id="updated"></span>
      </footer>

    </main>
  </div>

  <script>
    (function () {

      var weekdays = {
        1: "Mánadag",
        2: "Týsdag",
        3: "Mikudag",
        4: "Hósdag",
        5: "Fríggjadag"
      };

      var retryDelay =
        30000;

      var refreshDelay =
        15 * 60 * 1000;

      var requestTimeout =
        12000;

      var retryTimer =
        null;

      var refreshTimer =
        null;

      var iconVersion =
        "20260807-tizen4";

      var storageKey =
        "glasir-menu-cache-dagurin-bg-tizen4";


      function twoDigits(number) {
        return number < 10
          ? "0" + number
          : "" + number;
      }


      function escapeHtml(value) {

        return String(value)

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#39;"
          );
      }


      function updateClock() {

        var now =
          new Date();

        var weekDayNames = [
          "sunnudagur",
          "mánadagur",
          "týsdagur",
          "mikudagur",
          "hósdagur",
          "fríggjadagur",
          "leygardagur"
        ];

        var monthNames = [
          "januar",
          "februar",
          "mars",
          "apríl",
          "mai",
          "juni",
          "juli",
          "august",
          "september",
          "oktober",
          "november",
          "desember"
        ];


        document
          .getElementById(
            "dateText"
          )
          .innerHTML =

            weekDayNames[
              now.getDay()
            ]

            + " "

            + now.getDate()

            + ". "

            + monthNames[
              now.getMonth()
            ];


        document
          .getElementById(
            "timeText"
          )
          .innerHTML =

            twoDigits(
              now.getHours()
            )

            + "."

            + twoDigits(
              now.getMinutes()
            );
      }


      function formatDate(value) {

        var date =
          new Date(value);

        if (
          isNaN(
            date.getTime()
          )
        ) {
          return String(value);
        }

        return (

          twoDigits(
            date.getDate()
          )

          + "."

          + twoDigits(
            date.getMonth() + 1
          )

          + "."

          + date.getFullYear()

          + " kl. "

          + twoDigits(
            date.getHours()
          )

          + "."

          + twoDigits(
            date.getMinutes()
          )
        );
      }


      function setStatus(text) {

        document
          .getElementById(
            "status"
          )
          .innerHTML =

            escapeHtml(
              text || ""
            );
      }


      function renderContent(
        dayName,
        dishText
      ) {

        document
          .getElementById(
            "content"
          )
          .innerHTML =

          '<div class="stripe"></div>'

          +

          '<div class="content">'

            +

            '<div class="icon-disc">'

              +

              '<img src="' +
                'today-icon.png?v=' +
                iconVersion +
                '" alt="">'

            +

            '</div>'

            +

            '<div class="day-row">'

              +

              '<span class="badge">' +
                'Í DAG' +
              '</span>'

              +

              '<h2 class="day">' +
                escapeHtml(
                  dayName
                ) +
              '</h2>'

            +

            '</div>'

            +

            '<p class="dish">' +
              escapeHtml(
                dishText
              ) +
            '</p>'

          +

          '</div>';
      }


      function renderError(
        message,
        detail
      ) {

        document
          .getElementById(
            "content"
          )
          .innerHTML =

          '<div class="stripe"></div>'

          +

          '<div class="content">'

            +

            '<div class="error">'

              +

              escapeHtml(
                message
              )

              +

              '<div class="suberror">' +

                escapeHtml(
                  detail || ""
                )

              +

              '</div>'

            +

            '</div>'

          +

          '</div>';
      }


      function renderMenu(
        data,
        fromCache
      ) {

        if (
          !data ||
          !data.days ||
          !data.days.length
        ) {
          throw new Error(
            "Ógildug menu.json"
          );
        }


        var todayName =
          weekdays[
            new Date().getDay()
          ];


        var dishText =
          "Eingin rættur er skrásettur";


        var item =
          null;


        var i;


        if (!todayName) {

          renderContent(
            "Vikuskifti",
            "Eingin matskrá er í dag"
          );

        } else {

          for (
            i = 0;
            i < data.days.length;
            i++
          ) {

            if (
              data.days[i].day ===
              todayName
            ) {

              item =
                data.days[i];

              break;
            }
          }


          if (
            item &&
            item.dish
          ) {

            dishText =
              item.dish;
          }


          renderContent(
            todayName,
            dishText
          );
        }


        if (
          data.updated_at
        ) {

          document
            .getElementById(
              "updated"
            )
            .innerHTML =

            "Dagført "

            +

            escapeHtml(
              formatDate(
                data.updated_at
              )
            );

        } else {

          document
            .getElementById(
              "updated"
            )
            .innerHTML =
              "";
        }


        setStatus(

          fromCache

            ? "Vísir seinast goymdu matskrá"

            : ""
        );
      }


      function saveCache(data) {

        try {

          localStorage.setItem(
            storageKey,
            JSON.stringify(data)
          );

        } catch (error) {

        }
      }


      function loadCache() {

        try {

          var cached =
            localStorage.getItem(
              storageKey
            );

          return cached

            ? JSON.parse(
                cached
              )

            : null;

        } catch (error) {

          return null;
        }
      }


      function scheduleRetry() {

        if (
          retryTimer
        ) {

          clearTimeout(
            retryTimer
          );
        }


        retryTimer =
          setTimeout(
            loadMenu,
            retryDelay
          );
      }


      function scheduleRefresh() {

        if (
          refreshTimer
        ) {

          clearTimeout(
            refreshTimer
          );
        }


        refreshTimer =
          setTimeout(
            loadMenu,
            refreshDelay
          );
      }


      function handleFailure() {

        var cached =
          loadCache();


        if (cached) {

          try {

            renderMenu(
              cached,
              true
            );

            setStatus(
              "Samband fekst ikki – roynir aftur"
            );

          } catch (error) {

            renderError(
              "Matskráin fekst ikki fram.",
              "Roynir aftur um 30 sekund."
            );
          }

        } else {

          renderError(
            "Matskráin fekst ikki fram.",
            "Roynir aftur um 30 sekund."
          );
        }


        scheduleRetry();
      }


      function loadMenu() {

        var request =
          new XMLHttpRequest();


        var finished =
          false;


        setStatus(
          "Dagførir…"
        );


        request.open(

          "GET",

          "menu.json?v=" +
            new Date().getTime(),

          true
        );


        request.timeout =
          requestTimeout;


        request.onreadystatechange =
          function () {

            if (
              request.readyState !== 4 ||
              finished
            ) {

              return;
            }


            finished =
              true;


            if (
              request.status >= 200 &&
              request.status < 300
            ) {

              try {

                var data =
                  JSON.parse(
                    request.responseText
                  );


                renderMenu(
                  data,
                  false
                );


                saveCache(
                  data
                );


                scheduleRefresh();


              } catch (error) {

                handleFailure();
              }


            } else {

              handleFailure();
            }
          };


        request.onerror =
          function () {

            if (!finished) {

              finished =
                true;

              handleFailure();
            }
          };


        request.ontimeout =
          function () {

            if (!finished) {

              finished =
                true;

              handleFailure();
            }
          };


        try {

          request.send();

        } catch (error) {

          if (!finished) {

            finished =
              true;

            handleFailure();
          }
        }
      }


      updateClock();


      setInterval(
        updateClock,
        30000
      );


      var cached =
        loadCache();


      if (cached) {

        try {

          renderMenu(
            cached,
            true
          );

        } catch (error) {

        }
      }


      loadMenu();

    }());
  </script>

</body>
</html>
