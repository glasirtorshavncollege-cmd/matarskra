<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="900">
  <title>Matskrá á Glasi</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #111816;
      background: linear-gradient(145deg, #ffffff 0%, #f6faf7 100%);
    }

    main {
      width: 100%;
      height: 100%;
      padding: 32px 50px 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 112px;
      flex: 0 0 112px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      color: #005a46;
      font-size: 64px;
      line-height: 0.95;
    }

    .subtitle {
      margin-top: 12px;
      color: #0b8a64;
      font-size: 26px;
    }

    .clock {
      padding-top: 10px;
      color: #005a46;
      font-size: 24px;
      white-space: nowrap;
    }

    .menu {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .card {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      margin-bottom: 13px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #ffffff;
      border: 3px solid transparent;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0, 70, 52, 0.11);
    }

    .card:last-child {
      margin-bottom: 0;
    }

    .card.today {
      background: transparent;
      border-color: #005a46;
      box-shadow: none;
    }

    .stripe {
      align-self: stretch;
      width: 18px;
      flex: 0 0 18px;
    }

    .card:nth-child(1) .stripe { background: #59b7a6; }
    .card:nth-child(2) .stripe { background: #79b92f; }
    .card:nth-child(3) .stripe { background: #1ca27f; }
    .card:nth-child(4) .stripe { background: #005a46; }
    .card:nth-child(5) .stripe { background: #8bc53e; }

    .icon-disc {
      width: 82px;
      flex: 0 0 82px;
      margin-left: 14px;
      margin-right: 10px;
      text-align: center;
    }

    .icon-disc img {
      display: block;
      width: 70px;
      height: 70px;
      margin: 0 auto;
      object-fit: contain;
    }

    .day-wrap {
      width: 220px;
      flex: 0 0 220px;
      margin-right: 18px;
    }

    .day {
      margin: 0;
      color: #005a46;
      font-size: 34px;
      line-height: 1;
      white-space: nowrap;
    }

    .dish {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      padding-right: 30px;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.12;
      word-break: normal;
    }

    .badge {
      display: none;
      position: absolute;
      top: 9px;
      left: 36px;
      padding: 8px 15px;
      border-radius: 20px;
      background: #0b8a64;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .today .badge {
      display: block;
    }

    footer {
      height: 24px;
      flex: 0 0 24px;
      padding-top: 7px;
      text-align: right;
      color: #0b8a64;
      font-size: 15px;
    }

    .status {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #005a46;
      font-size: 38px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Matskrá á Glasi</h1>
        <div class="subtitle">Døgurði frá kl. 11:15 til 12:30</div>
      </div>

      <div class="clock">
        <span id="dateText">Lesur dagfesting…</span>
        <span> | </span>
        <strong id="timeText"></strong>
      </div>
    </header>

    <section class="menu" id="menu">
      <div class="status">Lesur matskránna…</div>
    </section>

    <footer id="updated"></footer>
  </main>

  <script>
    var menuDays = {
      "Mánadag": 1,
      "Týsdag": 2,
      "Mikudag": 3,
      "Hósdag": 4,
      "Fríggjadag": 5
    };

    var icons = [
      "menu-icon-1.png",
      "menu-icon-2.png",
      "menu-icon-3.png",
      "menu-icon-4.png",
      "menu-icon-5.png"
    ];

    var iconVersion = "20260731-9";

    function twoDigits(number) {
      return number < 10 ? "0" + number : "" + number;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function updateClock() {
      var now = new Date();

      var weekdays = [
        "sunnudagur",
        "mánadagur",
        "týsdagur",
        "mikudagur",
        "hósdagur",
        "fríggjadagur",
        "leygardagur"
      ];

      var months = [
        "januar",
        "februar",
        "mars",
        "apríl",
        "mai",
        "juni",
        "juli",
        "august",
        "september",
        "oktober",
        "november",
        "desember"
      ];

      document.getElementById("dateText").innerHTML =
        weekdays[now.getDay()] + " " +
        now.getDate() + ". " +
        months[now.getMonth()];

      document.getElementById("timeText").innerHTML =
        twoDigits(now.getHours()) + "." +
        twoDigits(now.getMinutes());
    }

    function showError(message) {
      document.getElementById("menu").innerHTML =
        '<div class="status">' + escapeHtml(message) + '</div>';
    }

    function renderMenu(data) {
      if (!data || !data.days || !data.days.length) {
        showError("Eingin matskrá varð funnin.");
        return;
      }

      var menu = document.getElementById("menu");
      var today = new Date().getDay();
      var html = "";
      var i;
      var item;
      var todayClass;
      var dish;

      for (i = 0; i < data.days.length; i++) {
        item = data.days[i];
        todayClass =
          menuDays[item.day] === today
            ? " today"
            : "";

        dish = item.dish
          ? item.dish
          : "Eingin rættur er skrásettur";

        html +=
          '<article class="card' + todayClass + '">' +
            '<div class="stripe"></div>' +
            '<span class="badge">Í DAG</span>' +
            '<div class="icon-disc">' +
              '<img src="' + icons[i] + '?v=' + iconVersion + '" alt="">' +
            '</div>' +
            '<div class="day-wrap">' +
              '<h2 class="day">' + escapeHtml(item.day) + '</h2>' +
            '</div>' +
            '<p class="dish">' + escapeHtml(dish) + '</p>' +
          '</article>';
      }

      menu.innerHTML = html;

      if (data.updated_at) {
        document.getElementById("updated").innerHTML =
          "Dagført " + escapeHtml(data.updated_at);
      }
    }

    function loadMenu() {
      var request = new XMLHttpRequest();

      request.open(
        "GET",
        "menu.json?v=" + new Date().getTime(),
        true
      );

      request.onreadystatechange = function() {
        if (request.readyState !== 4) {
          return;
        }

        if (request.status >= 200 && request.status < 300) {
          try {
            renderMenu(JSON.parse(request.responseText));
          } catch (error) {
            showError("Feilur í menu.json.");
          }
        } else {
          showError("Matskráin fekst ikki fram.");
        }
      };

      request.onerror = function() {
        showError("Samband fekst ikki við matskránna.");
      };

      request.send();
    }

    updateClock();
    loadMenu();

    setInterval(updateClock, 30000);
    setInterval(loadMenu, 15 * 60 * 1000);
  </script>
</body>
</html>
