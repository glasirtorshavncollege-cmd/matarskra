<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta http-equiv="refresh" content="900">

  <title>Dagsins rættur á Glasi</title>

  <style>
    :root {
      --bg: #eef2f4;
      --panel: #ffffff;
      --text: #15262e;
      --muted: #60727a;
      --accent: #006b7c;
      --accent-soft: #d9edf0;
      --shadow: 0 18px 45px rgba(15, 37, 46, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 8%,
          rgba(0, 107, 124, 0.16),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f7f9fa 0%,
          var(--bg) 100%
        );
    }

    main {
      width: 100%;
      height: 100%;
      padding: 58px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 36px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
    }

    h1 {
      margin: 0;
      font-size: 82px;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 16px;
      font-size: 30px;
      color: var(--muted);
    }

    .time {
      text-align: right;
      color: var(--muted);
      font-size: 26px;
      white-space: nowrap;
    }

    .card {
      min-height: 0;
      background: var(--panel);
      border: 4px solid var(--accent);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 55px 45px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .day {
      margin: 0 0 55px;
      padding: 16px 30px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 48px;
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .dish {
      margin: 0;
      max-width: 900px;
      font-size: 96px;
      font-weight: 700;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 22px;
    }

    .error {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 800px) {
      main {
        padding: 36px;
      }

      h1 {
        font-size: 64px;
      }

      .dish {
        font-size: 74px;
      }

      .day {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Dagsins rættur</h1>

        <div class="subtitle">
          Døgurði frá kl. 11:15 til 12:30
        </div>
      </div>

      <div class="time" id="clock"></div>
    </header>

    <section
      class="card"
      id="content"
      aria-live="polite"
    >
      <div class="error">
        Lesur matskránna…
      </div>
    </section>

    <footer>
      <span>Væl gagnist</span>
      <span id="updated"></span>
    </footer>
  </main>

  <script>
    var weekdays = {
      1: "Mánadag",
      2: "Týsdag",
      3: "Mikudag",
      4: "Hósdag",
      5: "Fríggjadag"
    };

    function updateClock() {
      var now = new Date();

      var date = new Intl.DateTimeFormat(
        "fo-FO",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      ).format(now);

      var time = new Intl.DateTimeFormat(
        "fo-FO",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(now);

      document.getElementById("clock").textContent =
        date + " · " + time;
    }

    function loadMenu() {
      var content = document.getElementById("content");

      fetch(
        "menu.json?v=" + Date.now(),
        {
          cache: "no-store"
        }
      )
        .then(function(response) {
          if (!response.ok) {
            throw new Error(
              "HTTP " + response.status
            );
          }

          return response.json();
        })
        .then(function(data) {
          var todayName =
            weekdays[new Date().getDay()];

          if (!todayName) {
            content.innerHTML =
              '<h2 class="day">Vikuskifti</h2>' +
              '<p class="dish">' +
              'Eingin matskrá er í dag' +
              '</p>';

            return;
          }

          var item = null;

          for (
            var i = 0;
            i < data.days.length;
            i++
          ) {
            if (
              data.days[i].day === todayName
            ) {
              item = data.days[i];
              break;
            }
          }

          var dishText =
            item && item.dish
              ? item.dish
              : "Eingin rættur er skrásettur";

          content.innerHTML =
            '<h2 class="day">' +
            todayName +
            '</h2>' +
            '<p class="dish">' +
            dishText +
            '</p>';

          if (data.updated_at) {
            var when =
              new Date(data.updated_at);

            var formatted =
              new Intl.DateTimeFormat(
                "fo-FO",
                {
                  day: "2-digit",
                  month: "2-digit",
                  year: "numeric",
                  hour: "2-digit",
                  minute: "2-digit"
                }
              ).format(when);

            document.getElementById(
              "updated"
            ).textContent =
              "Dagført " + formatted;
          }
        })
        .catch(function(error) {
          console.error(error);

          content.innerHTML =
            '<div class="error">' +
            'Matskráin fekst ikki fram.' +
            '</div>';
        });
    }

    updateClock();
    loadMenu();

    setInterval(
      updateClock,
      30000
    );

    setInterval(
      loadMenu,
      15 * 60 * 1000
    );
  </script>
</body>
</html>
