<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="900">
  <title>Dagsins rættur á Glasi</title>
  <style>
    :root{
      --dark:#005a46;
      --green:#118b65;
      --mint:#eaf5ef;
      --text:#10241d;
      --muted:#6a8279;
      --shadow:0 18px 42px rgba(0,60,45,.14);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 80% 12%, rgba(17,139,101,.06), transparent 23%),
        radial-gradient(circle at 92% 85%, rgba(114,182,44,.07), transparent 22%),
        linear-gradient(135deg,#fbfdfc 0%,#f3f8f5 100%);
    }
    body:before,body:after{
      content:"";
      position:absolute;
      right:35px;
      width:190px;height:300px;
      opacity:.18;
      background:
        linear-gradient(145deg,transparent 45%,#6eb48f 46% 48%,transparent 49%),
        radial-gradient(ellipse at 50% 22%,#a6d3bb 0 28%,transparent 29%),
        radial-gradient(ellipse at 35% 48%,#a6d3bb 0 24%,transparent 25%),
        radial-gradient(ellipse at 62% 70%,#a6d3bb 0 26%,transparent 27%);
      pointer-events:none;
    }
    body:before{top:20px}
    body:after{bottom:0;transform:rotate(12deg)}
    main{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      padding:46px 58px 34px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:28px;
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:30px;
    }
    h1{
      margin:0;
      font-size:78px;
      line-height:.96;
      color:var(--dark);
      letter-spacing:-.045em;
    }
    .subtitle{
      margin-top:14px;
      font-size:28px;
      color:var(--green);
    }
    .clock{
      display:flex;
      align-items:center;
      gap:16px;
      color:var(--dark);
      font-size:24px;
      white-space:nowrap;
      padding-bottom:4px;
    }
    .calendar-icon{
      width:28px;height:28px;
      border:3px solid var(--dark);
      border-radius:5px;
      position:relative;
    }
    .calendar-icon:before{
      content:"";
      position:absolute;left:-3px;right:-3px;top:6px;
      border-top:3px solid var(--dark);
    }
    .calendar-icon:after{
      content:"";
      position:absolute;width:4px;height:4px;left:6px;top:12px;
      background:var(--dark);
      box-shadow:8px 0 var(--dark),0 8px var(--dark),8px 8px var(--dark);
    }
    .card{
      min-height:0;
      background:rgba(255,255,255,.97);
      border-radius:28px;
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:22px 270px 1fr;
      align-items:center;
      overflow:hidden;
    }
    .stripe{
      height:100%;
      background:linear-gradient(180deg,#159c72,var(--dark));
    }
    .cloche-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100%;
    }
    .cloche-circle{
      width:190px;height:190px;
      border-radius:50%;
      background:var(--mint);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:105px;
    }
    .content{
      padding:45px 55px 45px 20px;
    }
    .day-row{
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:28px;
    }
    .badge{
      padding:10px 20px;
      border-radius:999px;
      background:var(--green);
      color:#fff;
      font-size:26px;
      font-weight:700;
      letter-spacing:.04em;
    }
    .day{
      margin:0;
      font-size:52px;
      color:var(--dark);
      line-height:1;
    }
    .dish{
      margin:0;
      font-size:82px;
      line-height:1.06;
      font-weight:700;
      letter-spacing:-.025em;
      color:#0d1713;
      overflow-wrap:anywhere;
    }
    footer{
      display:flex;
      justify-content:flex-end;
      color:var(--green);
      font-size:18px;
    }
    .error{
      font-size:44px;
      font-weight:700;
      color:var(--dark);
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Dagsins rættur</h1>
      <div class="subtitle">Døgurði frá kl. 11:15 til 12:30</div>
    </div>
    <div class="clock">
      <span class="calendar-icon" aria-hidden="true"></span>
      <span id="dateText"></span>
      <span>|</span>
      <strong id="timeText"></strong>
    </div>
  </header>

  <section class="card" id="content" aria-live="polite">
    <div class="stripe"></div>
    <div class="cloche-wrap"><div class="cloche-circle">🍽</div></div>
    <div class="content"><div class="error">Lesur matskránna…</div></div>
  </section>

  <footer><span id="updated"></span></footer>
</main>

<script>
var weekdays={1:"Mánadag",2:"Týsdag",3:"Mikudag",4:"Hósdag",5:"Fríggjadag"};

function updateClock(){
  var now=new Date();
  document.getElementById("dateText").textContent=
    new Intl.DateTimeFormat("fo-FO",{weekday:"long",day:"numeric",month:"long"}).format(now);
  document.getElementById("timeText").textContent=
    new Intl.DateTimeFormat("fo-FO",{hour:"2-digit",minute:"2-digit"}).format(now);
}
function render(day,dish){
  document.getElementById("content").innerHTML=
    '<div class="stripe"></div>'+
    '<div class="cloche-wrap"><div class="cloche-circle">🍽</div></div>'+
    '<div class="content">'+
      '<div class="day-row"><span class="badge">Í DAG</span><h2 class="day">'+day+'</h2></div>'+
      '<p class="dish">'+dish+'</p>'+
    '</div>';
}
function loadMenu(){
  fetch("menu.json?v="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(data){
      var todayName=weekdays[new Date().getDay()];
      if(!todayName){
        render("Vikuskifti","Eingin matskrá er í dag");
      }else{
        var item=null;
        for(var i=0;i<data.days.length;i++){
          if(data.days[i].day===todayName){item=data.days[i];break;}
        }
        render(todayName,item&&item.dish?item.dish:"Eingin rættur er skrásettur");
      }
      if(data.updated_at){
        var when=new Date(data.updated_at);
        document.getElementById("updated").textContent="Dagført "+
          new Intl.DateTimeFormat("fo-FO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(when);
      }
    })
    .catch(function(e){
      console.error(e);
      document.getElementById("content").innerHTML=
        '<div class="stripe"></div><div class="cloche-wrap"><div class="cloche-circle">🍽</div></div>'+
        '<div class="content"><div class="error">Matskráin fekst ikki fram.</div></div>';
    });
}
updateClock();loadMenu();
setInterval(updateClock,30000);
setInterval(loadMenu,15*60*1000);
</script>
</body>
</html>
