<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta http-equiv="refresh" content="900">

  <title>Dagsins rættur á Glasi</title>

  <style>
    :root {
      --bg: #f3f7f5;
      --panel: #ffffff;
      --text: #17352c;
      --muted: #6d847b;
      --accent: #006c4f;
      --accent-2: #2f8f6b;
      --accent-soft: #dcefe7;
      --shadow: 0 18px 45px rgba(20, 53, 44, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 8%, rgba(47, 143, 107, 0.10), transparent 30%),
        radial-gradient(circle at 92% 90%, rgba(0, 108, 79, 0.06), transparent 22%),
        linear-gradient(135deg, #f9fbfa 0%, var(--bg) 100%);
    }

    main {
      width: 100%;
      height: 100%;
      padding: 58px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
    }

    h1 {
      margin: 0;
      font-size: 82px;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--accent);
    }

    .subtitle {
      margin-top: 16px;
      font-size: 30px;
      color: var(--muted);
    }

    .time {
      text-align: right;
      color: var(--accent);
      font-size: 26px;
      white-space: nowrap;
    }

    .card {
      min-height: 0;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid rgba(0, 108, 79, 0.18);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 0;
      overflow: hidden;

      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: stretch;
    }

    .stripe {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
    }

    .content-inner {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 50px;
      min-height: 100%;
    }

    .day-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 34px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .today-badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.05em;
    }

    .day {
      margin: 0;
      color: var(--accent);
      font-size: 58px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .dish {
      margin: 0;
      max-width: 980px;
      font-size: 94px;
      font-weight: 700;
      line-height: 1.08;
      overflow-wrap: anywhere;
      color: #17352c;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 22px;
    }

    .error {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      color: var(--accent);
    }

    @media (max-width: 800px) {
      main {
        padding: 36px;
      }

      h1 {
        font-size: 64px;
      }

      .dish {
        font-size: 74px;
      }

      .day {
        font-size: 44px;
      }

      .today-badge {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Dagsins rættur</h1>

        <div class="subtitle">
          Døgurði frá kl. 11:15 til 12:30
        </div>
      </div>

      <div class="time" id="clock"></div>
    </header>

    <section class="card" id="content" aria-live="polite">
      <div class="stripe"></div>
      <div class="content-inner">
        <div class="error">Lesur matskránna…</div>
      </div>
    </section>

    <footer>
      <span>Væl gagnist</span>
      <span id="updated"></span>
    </footer>
  </main>

  <script>
    var weekdays = {
      1: "Mánadag",
      2: "Týsdag",
      3: "Mikudag",
      4: "Hósdag",
      5: "Fríggjadag"
    };

    function updateClock() {
      var now = new Date();

      var date = new Intl.DateTimeFormat(
        "fo-FO",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      ).format(now);

      var time = new Intl.DateTimeFormat(
        "fo-FO",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(now);

      document.getElementById("clock").textContent =
        date + " · " + time;
    }

    function renderContent(dayName, dishText, weekend) {
      var content = document.getElementById("content");

      var inner = "";
      if (weekend) {
        inner =
          '<div class="stripe"></div>' +
          '<div class="content-inner">' +
          '<div class="day-row">' +
          '<span class="today-badge">Í DAG</span>' +
          '<h2 class="day">Vikuskifti</h2>' +
          '</div>' +
          '<p class="dish">Eingin matskrá er í dag</p>' +
          '</div>';
      } else {
        inner =
          '<div class="stripe"></div>' +
          '<div class="content-inner">' +
          '<div class="day-row">' +
          '<span class="today-badge">Í DAG</span>' +
          '<h2 class="day">' + dayName + '</h2>' +
          '</div>' +
          '<p class="dish">' + dishText + '</p>' +
          '</div>';
      }

      content.innerHTML = inner;
    }

    function loadMenu() {
      fetch(
        "menu.json?v=" + Date.now(),
        {
          cache: "no-store"
        }
      )
        .then(function(response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.json();
        })
        .then(function(data) {
          var todayName = weekdays[new Date().getDay()];

          if (!todayName) {
            renderContent("", "", true);
          } else {
            var item = null;

            for (var i = 0; i < data.days.length; i++) {
              if (data.days[i].day === todayName) {
                item = data.days[i];
                break;
              }
            }

            var dishText =
              item && item.dish
                ? item.dish
                : "Eingin rættur er skrásettur";

            renderContent(todayName, dishText, false);
          }

          if (data.updated_at) {
            var when = new Date(data.updated_at);

            var formatted =
              new Intl.DateTimeFormat(
                "fo-FO",
                {
                  day: "2-digit",
                  month: "2-digit",
                  year: "numeric",
                  hour: "2-digit",
                  minute: "2-digit"
                }
              ).format(when);

            document.getElementById("updated").textContent =
              "Dagført " + formatted;
          }
        })
        .catch(function(error) {
          console.error(error);

          document.getElementById("content").innerHTML =
            '<div class="stripe"></div>' +
            '<div class="content-inner">' +
            '<div class="error">Matskráin fekst ikki fram.</div>' +
            '</div>';
        });
    }

    updateClock();
    loadMenu();

    setInterval(updateClock, 30000);
    setInterval(loadMenu, 15 * 60 * 1000);
  </script>
</body>
</html>
