<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="900">

  <title>Matskrá á Glasi</title>

  <style>
    :root {
      --bg: #f3f7f5;
      --bg-soft: #eef4f1;
      --panel: #ffffff;
      --text: #17352c;
      --muted: #6d847b;
      --accent: #006c4f;
      --accent-2: #2f8f6b;
      --accent-soft: #dcefe7;
      --line: #d8e5df;
      --shadow: 0 10px 28px rgba(20, 53, 44, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 8%, rgba(47, 143, 107, 0.08), transparent 28%),
        radial-gradient(circle at 92% 88%, rgba(0, 108, 79, 0.06), transparent 24%),
        linear-gradient(135deg, #f9fbfa 0%, var(--bg) 100%);
    }

    main {
      width: 100%;
      height: 100%;
      padding: 44px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: 68px;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--accent);
    }

    .subtitle {
      margin-top: 12px;
      font-size: 27px;
      color: var(--muted);
    }

    .time {
      text-align: right;
      color: var(--accent);
      font-size: 22px;
      white-space: nowrap;
    }

    .menu {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: 24px;
    }

    .card {
      min-height: 0;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 30px;
      display: grid;
      grid-template-columns: 18px 1fr 4fr;
      align-items: center;
      column-gap: 22px;
      border: 2px solid transparent;
      overflow: hidden;
    }

    .stripe {
      width: 18px;
      height: calc(100% + 44px);
      margin: -22px 0 -22px -30px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
    }

    .card.today {
      border-color: var(--accent);
      box-shadow: 0 12px 30px rgba(0, 108, 79, 0.12);
    }

    .card.today .stripe {
      background: linear-gradient(180deg, #0b8a67, #005d45);
    }

    .day-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .day {
      margin: 0;
      font-size: 31px;
      color: var(--accent);
      line-height: 1;
      white-space: nowrap;
    }

    .today-badge {
      display: none;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .card.today .today-badge {
      display: inline-block;
    }

    .dish {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.18;
      overflow-wrap: anywhere;
      color: #1b2924;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 18px;
      padding: 0 4px;
    }

    .error {
      align-self: center;
      text-align: center;
      font-size: 42px;
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Matskrá á Glasi</h1>
        <div class="subtitle">Døgurði frá kl. 11:15 til 12:30</div>
      </div>

      <div class="time" id="clock"></div>
    </header>

    <section class="menu" id="menu" aria-live="polite"></section>

    <footer>
      <span>Væl gagnist</span>
      <span id="updated"></span>
    </footer>
  </main>

  <script>
    var dayIndex = {
      "Mánadag": 1,
      "Týsdag": 2,
      "Mikudag": 3,
      "Hósdag": 4,
      "Fríggjadag": 5
    };

    function updateClock() {
      var now = new Date();

      var date = new Intl.DateTimeFormat("fo-FO", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(now);

      var time = new Intl.DateTimeFormat("fo-FO", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);

      document.getElementById("clock").textContent = date + " · " + time;
    }

    function loadMenu() {
      var menu = document.getElementById("menu");

      fetch("menu.json?v=" + Date.now(), {
        cache: "no-store"
      })
        .then(function(response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function(data) {
          var today = new Date().getDay();
          menu.innerHTML = "";

          for (var i = 0; i < data.days.length; i++) {
            var item = data.days[i];
            var isToday = dayIndex[item.day] === today;

            var card = document.createElement("article");
            card.className = "card" + (isToday ? " today" : "");

            var stripe = document.createElement("div");
            stripe.className = "stripe";

            var dayWrap = document.createElement("div");
            dayWrap.className = "day-wrap";

            var heading = document.createElement("h2");
            heading.className = "day";
            heading.textContent = item.day;

            var badge = document.createElement("span");
            badge.className = "today-badge";
            badge.textContent = "Í DAG";

            dayWrap.appendChild(heading);
            dayWrap.appendChild(badge);

            var dish = document.createElement("p");
            dish.className = "dish";
            dish.textContent = item.dish || "Eingin rættur er skrásettur";

            card.appendChild(stripe);
            card.appendChild(dayWrap);
            card.appendChild(dish);

            menu.appendChild(card);
          }

          if (data.updated_at) {
            var when = new Date(data.updated_at);

            document.getElementById("updated").textContent =
              "Dagført " +
              new Intl.DateTimeFormat("fo-FO", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }).format(when);
          }
        })
        .catch(function(error) {
          console.error(error);
          menu.innerHTML = '<div class="error">Matskráin fekst ikki fram.</div>';
        });
    }

    updateClock();
    loadMenu();

    setInterval(updateClock, 30000);
    setInterval(loadMenu, 15 * 60 * 1000);
  </script>
</body>
</html>
