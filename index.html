<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="900">
  <title>Matskrá á Glasi</title>
  <style>
    :root{
      --dark:#005a46;
      --green:#118b65;
      --lime:#72b62c;
      --mint:#eaf5ef;
      --text:#162620;
      --muted:#6a8279;
      --panel:#ffffff;
      --shadow:0 10px 24px rgba(0,60,45,.12);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 86% 18%, rgba(17,139,101,.06), transparent 22%),
        radial-gradient(circle at 90% 84%, rgba(114,182,44,.07), transparent 22%),
        linear-gradient(135deg,#fbfdfc 0%,#f3f8f5 100%);
    }
    body:before, body:after{
      content:"";
      position:absolute;
      right:40px;
      width:180px;
      height:300px;
      opacity:.18;
      background:
        linear-gradient(145deg,transparent 45%,#6eb48f 46% 48%,transparent 49%),
        radial-gradient(ellipse at 50% 22%,#a6d3bb 0 28%,transparent 29%),
        radial-gradient(ellipse at 35% 48%,#a6d3bb 0 24%,transparent 25%),
        radial-gradient(ellipse at 62% 70%,#a6d3bb 0 26%,transparent 27%);
      transform:rotate(-12deg);
      pointer-events:none;
    }
    body:before{top:40px}
    body:after{bottom:10px;transform:rotate(10deg)}
    main{
      position:relative;
      width:100%;
      height:100%;
      padding:42px 54px 34px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:24px;
      z-index:1;
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:30px;
    }
    h1{
      margin:0;
      font-size:72px;
      line-height:.96;
      color:var(--dark);
      letter-spacing:-.045em;
    }
    .subtitle{
      margin-top:14px;
      font-size:27px;
      color:var(--green);
    }
    .clock{
      display:flex;
      align-items:center;
      gap:16px;
      color:var(--dark);
      font-size:24px;
      white-space:nowrap;
      padding-bottom:4px;
    }
    .calendar-icon{
      width:28px;height:28px;
      border:3px solid var(--dark);
      border-radius:5px;
      position:relative;
    }
    .calendar-icon:before{
      content:"";
      position:absolute;
      left:-3px;right:-3px;top:6px;
      border-top:3px solid var(--dark);
    }
    .calendar-icon:after{
      content:"";
      position:absolute;
      width:4px;height:4px;
      left:6px;top:12px;
      background:var(--dark);
      box-shadow:8px 0 var(--dark),0 8px var(--dark),8px 8px var(--dark);
    }
    .menu{
      min-height:0;
      display:grid;
      grid-template-rows:repeat(5,minmax(0,1fr));
      gap:18px;
    }
    .card{
      background:rgba(255,255,255,.96);
      border-radius:18px;
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:18px 80px 210px 1fr;
      align-items:center;
      gap:22px;
      overflow:hidden;
      border:2px solid transparent;
      min-height:0;
    }
    .card.today{
      border-color:var(--dark);
      box-shadow:0 12px 28px rgba(0,90,70,.16);
    }
    .stripe{height:100%}
    .card:nth-child(1) .stripe{background:#5ab5a5}
    .card:nth-child(2) .stripe{background:#72b62c}
    .card:nth-child(3) .stripe{background:#1aa17d}
    .card:nth-child(4) .stripe{background:#005a46}
    .card:nth-child(5) .stripe{background:#8dc63f}
    .food-icon{
      width:58px;height:58px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--mint);
      font-size:32px;
    }
    .day-wrap{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .day{
      margin:0;
      font-size:31px;
      color:var(--dark);
      line-height:1;
      white-space:nowrap;
    }
    .card:nth-child(2) .day,
    .card:nth-child(5) .day{color:#5c9e21}
    .today-badge{
      display:none;
      padding:7px 13px;
      border-radius:999px;
      color:#fff;
      background:var(--green);
      font-size:14px;
      font-weight:700;
      letter-spacing:.05em;
      white-space:nowrap;
    }
    .today .today-badge{display:inline-block}
    .dish{
      margin:0;
      font-size:28px;
      font-weight:500;
      line-height:1.16;
      color:#111b17;
      overflow-wrap:anywhere;
    }
    footer{
      display:flex;
      justify-content:flex-end;
      color:var(--green);
      font-size:18px;
    }
    .error{
      align-self:center;
      text-align:center;
      font-size:40px;
      color:var(--dark);
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Matskrá á Glasi</h1>
      <div class="subtitle">Døgurði frá kl. 11:15 til 12:30</div>
    </div>
    <div class="clock">
      <span class="calendar-icon" aria-hidden="true"></span>
      <span id="dateText"></span>
      <span>|</span>
      <strong id="timeText"></strong>
    </div>
  </header>

  <section class="menu" id="menu" aria-live="polite"></section>

  <footer><span id="updated"></span></footer>
</main>

<script>
var dayIndex={"Mánadag":1,"Týsdag":2,"Mikudag":3,"Hósdag":4,"Fríggjadag":5};
var icons=["☕","🌿","🐟","🍽","🥗"];

function updateClock(){
  var now=new Date();
  document.getElementById("dateText").textContent=
    new Intl.DateTimeFormat("fo-FO",{weekday:"long",day:"numeric",month:"long"}).format(now);
  document.getElementById("timeText").textContent=
    new Intl.DateTimeFormat("fo-FO",{hour:"2-digit",minute:"2-digit"}).format(now);
}
function loadMenu(){
  var menu=document.getElementById("menu");
  fetch("menu.json?v="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(data){
      menu.innerHTML="";
      var today=new Date().getDay();
      for(var i=0;i<data.days.length;i++){
        var item=data.days[i];
        var card=document.createElement("article");
        card.className="card"+(dayIndex[item.day]===today?" today":"");
        card.innerHTML=
          '<div class="stripe"></div>'+
          '<div class="food-icon">'+icons[i]+'</div>'+
          '<div class="day-wrap"><h2 class="day">'+item.day+'</h2><span class="today-badge">Í DAG</span></div>'+
          '<p class="dish">'+(item.dish||"Eingin rættur er skrásettur")+'</p>';
        menu.appendChild(card);
      }
      if(data.updated_at){
        var when=new Date(data.updated_at);
        document.getElementById("updated").textContent="Dagført "+
          new Intl.DateTimeFormat("fo-FO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(when);
      }
    })
    .catch(function(e){
      console.error(e);
      menu.innerHTML='<div class="error">Matskráin fekst ikki fram.</div>';
    });
}
updateClock();loadMenu();
setInterval(updateClock,30000);
setInterval(loadMenu,15*60*1000);
</script>
</body>
</html>
