<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta http-equiv="refresh" content="900">

  <title>Matskrá á Glasi</title>

  <style>
    :root {
      --dark: #005a46;
      --green: #0b8a64;
      --lime: #76b82a;
      --text: #111816;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #f8fbf9;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 1073px;
      min-height: 1916px;
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #f6faf7 100%
        );
    }

    .leaf-top,
    .leaf-bottom {
      position: absolute;
      right: 18px;
      width: 190px;
      opacity: 0.22;
    }

    .leaf-top {
      top: 20px;
    }

    .leaf-bottom {
      bottom: -15px;
      transform: scaleX(-1);
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 54px 66px 48px;

      display: grid;
      grid-template-rows: 180px 1fr 34px;
      gap: 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      color: var(--dark);
      font-size: 74px;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin-top: 18px;
      color: var(--green);
      font-size: 29px;
    }

    .clock {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 18px;

      color: var(--dark);
      font-size: 24px;
      white-space: nowrap;
    }

    .clock svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
    }

    .menu {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 26px;
    }

    .card {
      height: 210px;
      flex: 0 0 210px;

      display: grid;
      grid-template-columns: 20px 110px 330px 1fr;
      align-items: center;
      column-gap: 24px;

      overflow: hidden;
      background: rgba(255, 255, 255, 0.97);
      border: 3px solid transparent;
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(0, 70, 52, 0.11);
    }

    .card.today {
      background: transparent;
      border-color: var(--dark);
      box-shadow: none;
    }

    .stripe {
      height: 100%;
    }

    .card:nth-child(1) .stripe {
      background: #59b7a6;
    }

    .card:nth-child(2) .stripe {
      background: #79b92f;
    }

    .card:nth-child(3) .stripe {
      background: #1ca27f;
    }

    .card:nth-child(4) .stripe {
      background: #005a46;
    }

    .card:nth-child(5) .stripe {
      background: #8bc53e;
    }

    .icon-disc {
      width: 78px;
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-disc img {
      display: block;
      width: 78px;
      height: 78px;
      object-fit: contain;
    }

    .day-wrap {
      display: flex;
      align-items: center;
      gap: 12px;

      min-width: 0;
      white-space: nowrap;
    }

    .day {
      margin: 0;
      color: var(--dark);
      font-size: 34px;
      line-height: 1;
      white-space: nowrap;
    }

    .card:nth-child(2) .day,
    .card:nth-child(5) .day {
      color: #5c9f20;
    }

    .badge {
      display: none;
      flex: 0 0 auto;

      padding: 8px 12px;
      border-radius: 999px;

      background: var(--green);
      color: #ffffff;

      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .today .badge {
      display: inline-block;
    }

    .dish {
      margin: 0;
      padding-right: 34px;

      font-size: 34px;
      font-weight: 500;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    footer {
      display: flex;
      justify-content: flex-end;

      color: var(--green);
      font-size: 17px;
    }
  </style>
</head>

<body>
  <div class="stage">

    <div class="leaf-top">
      <svg viewBox="0 0 180 300" aria-hidden="true">
        <g
          fill="none"
          stroke="#7fb69f"
          stroke-width="3"
        >
          <path d="M90 295 C88 210 100 120 125 18"/>
          <path d="M102 235 C70 212 50 188 38 162"/>
          <path d="M112 175 C142 148 160 120 168 92"/>
          <path d="M119 112 C92 92 78 70 70 46"/>
        </g>

        <g fill="#b7d7c8">
          <ellipse
            cx="54"
            cy="167"
            rx="26"
            ry="13"
            transform="rotate(38 54 167)"
          />
          <ellipse
            cx="154"
            cy="102"
            rx="29"
            ry="14"
            transform="rotate(-40 154 102)"
          />
          <ellipse
            cx="80"
            cy="58"
            rx="27"
            ry="13"
            transform="rotate(34 80 58)"
          />
          <ellipse
            cx="100"
            cy="230"
            rx="29"
            ry="14"
            transform="rotate(-24 100 230)"
          />
        </g>
      </svg>
    </div>

    <div class="leaf-bottom">
      <svg viewBox="0 0 180 300" aria-hidden="true">
        <g
          fill="none"
          stroke="#7fb69f"
          stroke-width="3"
        >
          <path d="M90 295 C88 210 100 120 125 18"/>
          <path d="M102 235 C70 212 50 188 38 162"/>
          <path d="M112 175 C142 148 160 120 168 92"/>
          <path d="M119 112 C92 92 78 70 70 46"/>
        </g>

        <g fill="#b7d7c8">
          <ellipse
            cx="54"
            cy="167"
            rx="26"
            ry="13"
            transform="rotate(38 54 167)"
          />
          <ellipse
            cx="154"
            cy="102"
            rx="29"
            ry="14"
            transform="rotate(-40 154 102)"
          />
          <ellipse
            cx="80"
            cy="58"
            rx="27"
            ry="13"
            transform="rotate(34 80 58)"
          />
          <ellipse
            cx="100"
            cy="230"
            rx="29"
            ry="14"
            transform="rotate(-24 100 230)"
          />
        </g>
      </svg>
    </div>

    <main>
      <header>
        <div>
          <h1>Matskrá á Glasi</h1>

          <div class="subtitle">
            Døgurði frá kl. 11:15 til 12:30
          </div>
        </div>

        <div class="clock">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2"
            />
            <path d="M8 3v4M16 3v4M3 10h18"/>
            <path d="M7 14h2M11 14h2M15 14h2M7 18h2M11 18h2"/>
          </svg>

          <span id="dateText"></span>
          <span>|</span>
          <strong id="timeText"></strong>
        </div>
      </header>

      <section
        class="menu"
        id="menu"
        aria-live="polite"
      ></section>

      <footer>
        <span id="updated"></span>
      </footer>
    </main>
  </div>

  <script>
    var dayIndex = {
      "Mánadag": 1,
      "Týsdag": 2,
      "Mikudag": 3,
      "Hósdag": 4,
      "Fríggjadag": 5
    };

    var icons = [
      "menu-icon-1.png",
      "menu-icon-2.png",
      "menu-icon-3.png",
      "menu-icon-4.png",
      "menu-icon-5.png"
    ];

    /*
      Broyt hetta talið, tá tú leggur nýggj ikon á GitHub.
      Tað tvingar browsaran at heinta ikonini umaftur.
    */
    var iconVersion = "20260731-2";

    function escapeHtml(value) {
      return String(value).replace(
        /[&<>"']/g,
        function(character) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
          }[character];
        }
      );
    }

    function updateClock() {
      var now = new Date();

      document.getElementById("dateText").textContent =
        new Intl.DateTimeFormat(
          "fo-FO",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        ).format(now);

      document.getElementById("timeText").textContent =
        new Intl.DateTimeFormat(
          "fo-FO",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        ).format(now);
    }

    function loadMenu() {
      fetch(
        "menu.json?v=" + Date.now(),
        {
          cache: "no-store"
        }
      )
        .then(function(response) {
          if (!response.ok) {
            throw new Error(
              "HTTP " + response.status
            );
          }

          return response.json();
        })
        .then(function(data) {
          var menu =
            document.getElementById("menu");

          var today =
            new Date().getDay();

          menu.innerHTML = "";

          for (
            var i = 0;
            i < data.days.length;
            i++
          ) {
            var item = data.days[i];

            var card =
              document.createElement("article");

            card.className =
              "card" +
              (
                dayIndex[item.day] === today
                  ? " today"
                  : ""
              );

            var iconUrl =
              icons[i] +
              "?v=" +
              iconVersion;

            card.innerHTML =
              '<div class="stripe"></div>' +

              '<div class="icon-disc">' +
                '<img src="' +
                iconUrl +
                '" alt="">' +
              '</div>' +

              '<div class="day-wrap">' +
                '<h2 class="day">' +
                  escapeHtml(item.day) +
                '</h2>' +

                '<span class="badge">' +
                  'Í DAG' +
                '</span>' +
              '</div>' +

              '<p class="dish">' +
                escapeHtml(
                  item.dish ||
                  "Eingin rættur er skrásettur"
                ) +
              '</p>';

            menu.appendChild(card);
          }

          if (data.updated_at) {
            var updated =
              new Date(data.updated_at);

            document.getElementById(
              "updated"
            ).textContent =
              "Dagført " +
              new Intl.DateTimeFormat(
                "fo-FO",
                {
                  day: "2-digit",
                  month: "2-digit",
                  year: "numeric",
                  hour: "2-digit",
                  minute: "2-digit"
                }
              ).format(updated);
          }
        })
        .catch(function(error) {
          console.error(error);

          document.getElementById(
            "menu"
          ).innerHTML =
            '<div style="' +
              'font-size:42px;' +
              'color:#005a46;' +
              'text-align:center' +
            '">' +
              'Matskráin fekst ikki fram.' +
            '</div>';
        });
    }

    updateClock();
    loadMenu();

    setInterval(
      updateClock,
      30000
    );

    setInterval(
      loadMenu,
      15 * 60 * 1000
    );
  </script>
</body>
</html>
