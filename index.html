<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="1800">

  <title>Matskrá á Glasi</title>

  <style>
    :root {
      --bg: #eef2f4;
      --panel: #ffffff;
      --text: #15262e;
      --muted: #60727a;
      --accent: #006b7c;
      --accent-soft: #d9edf0;
      --shadow: 0 12px 30px rgba(15, 37, 46, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(0, 107, 124, 0.12),
          transparent 28%
        ),
        linear-gradient(135deg, #f7f9fa 0%, var(--bg) 100%);
    }

    main {
      width: 100%;
      height: 100%;
      padding: 45px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: 68px;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 27px;
      color: var(--muted);
    }

    .time {
      text-align: right;
      color: var(--muted);
      font-size: 22px;
      white-space: nowrap;
    }

    .menu {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: 32px;
    }

    .card {
      min-height: 0;
      background: var(--panel);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 3px solid transparent;
    }

    .card.today {
      border-color: var(--accent);
    }

    .day {
      margin: 0 0 14px;
      font-size: 31px;
      color: var(--accent);
      line-height: 1;
    }

    .today .day::after {
      content: "Í DAG";
      display: inline-block;
      margin-left: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      font-size: 14px;
      vertical-align: middle;
      letter-spacing: 0.08em;
    }

    .dish {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 18px;
    }

    .error {
      align-self: center;
      text-align: center;
      font-size: 42px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Matskrá á Glasi</h1>
        <div class="subtitle">
          Døgurði frá kl. 11:15 til 12:30
        </div>
      </div>

      <div class="time" id="clock"></div>
    </header>

    <section
      class="menu"
      id="menu"
      aria-live="polite">
    </section>

    <footer>
      <span>Væl gagnist</span>
      <span id="updated"></span>
    </footer>
  </main>

  <script>
    const dayIndex = {
      "Mánadag": 1,
      "Týsdag": 2,
      "Mikudag": 3,
      "Hósdag": 4,
      "Fríggjadag": 5
    };

    function updateClock() {
      const now = new Date();

      const date = new Intl.DateTimeFormat("fo-FO", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(now);

      const time = new Intl.DateTimeFormat("fo-FO", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);

      document.getElementById("clock").textContent =
        `${date} · ${time}`;
    }

    async function loadMenu() {
      const menu = document.getElementById("menu");

      try {
        const response = await fetch(
          `menu.json?v=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const today = new Date().getDay();

        menu.innerHTML = "";

        for (const item of data.days) {
          const card = document.createElement("article");

          card.className =
            "card" +
            (dayIndex[item.day] === today ? " today" : "");

          const heading = document.createElement("h2");
          heading.className = "day";
          heading.textContent = item.day;

          const dish = document.createElement("p");
          dish.className = "dish";
          dish.textContent =
            item.dish || "Eingin rættur er skrásettur";

          card.append(heading, dish);
          menu.appendChild(card);
        }

        if (data.updated_at) {
          const when = new Date(data.updated_at);

          document.getElementById("updated").textContent =
            `Dagført ${
              new Intl.DateTimeFormat("fo-FO", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }).format(when)
            }`;
        }
      } catch (error) {
        console.error(error);

        menu.innerHTML =
          '<div class="error">Matskráin fekst ikki fram.</div>';
      }
    }

    updateClock();
    loadMenu();

    setInterval(updateClock, 30000);
    setInterval(loadMenu, 15 * 60 * 1000);
  </script>
</body>
</html>
