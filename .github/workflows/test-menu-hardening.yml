name: Test matskrá-hardening

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Vel støðuna, sum skal testast"
        required: true
        type: choice
        default: friday_after_13
        options:
          - friday_before_13
          - friday_after_13
          - saturday
          - sunday
          - monday
          - real_now

      reset_test_files:
        description: "Sletta test-output áðrenn koyring"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test-routing:
    runs-on: ubuntu-latest

    steps:
      - name: Heinta repository
        uses: actions/checkout@v6

      - name: Set Python upp
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Legg Python-pakkar inn
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Koyr test við veruligari matskrá
        shell: bash
        run: |
          RESET=""
          if [ "${{ inputs.reset_test_files }}" = "true" ]; then
            RESET="--reset"
          fi

          python scripts/test_menu_rotation.py \
            --scenario "${{ inputs.scenario }}" \
            $RESET

      - name: Vís testfílur
        shell: bash
        run: |
          echo "=== test-output ==="
          ls -la test-output || true

          echo ""
          echo "=== menu.json ==="
          cat test-output/menu.json 2>/dev/null || true

          echo ""
          echo "=== menu-next.json ==="
          cat test-output/menu-next.json 2>/dev/null || true

      - name: Goym testúrslit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test-output

          if git diff --cached --quiet; then
            echo "Ongar testbroytingar."
          else
            git commit -m "Test matskrá-hardening: ${{ inputs.scenario }}"
            git push
          fi
