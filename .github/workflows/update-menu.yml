name: Dagfør matskrá

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Heinta goymslu
        uses: actions/checkout@v4

      - name: Set Python upp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Legg pakkar inn
        run: pip install -r requirements.txt

      - name: Heinta matskrá
        run: python scripts/update_menu.py

      - name: Goym broytingar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git diff --cached --quiet || git commit -m "Dagfør matskrá"
          git push
