name: Dagfør matskrá

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Heinta repository
        uses: actions/checkout@v6

      - name: Set Python upp
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Legg Python-pakkar inn
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Heinta matskránna
        run: python update_menu.py

      - name: Goym broytingar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json

          if git diff --cached --quiet; then
            echo "Ongar broytingar."
          else
            git commit -m "Dagfør matskrá"
            git push
          fi
